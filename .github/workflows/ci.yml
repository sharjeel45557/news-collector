name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Unit tests
        run: pytest tests -k "not e2e"

      - name: End-to-end tests (fixtures + real browser)
        run: pytest tests/e2e

      - name: Offline build smoke test
        run: |
          python tests/gen_fixtures.py /tmp/fixtures
          python -m collector --fixtures /tmp/fixtures --out /tmp/site
          test -s /tmp/site/index.html
          test -s /tmp/site/news.json
